name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: typecheck + offline suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here: the plugin spawns agy through cmd.exe
        # and its process-tree termination path is Windows-specific.
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        # The @deepseek-ai/* packages are peerDependencies, and they are also
        # devDependencies so that a clean clone can typecheck against their real
        # declarations. Several of them have unpublished peer chains
        # (`dsh-type-meta` returns 404), so automatic peer resolution is off —
        # everything the compiler needs is listed explicitly.
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock --legacy-peer-deps

      - name: Typecheck (real peer declarations)
        run: npx tsc -p tsconfig.typecheck.json

      - name: Build (scripts/build.mjs picks the config for this layout)
        # Not a bare 	sc -p: a clean clone has the real peer declarations, so
        # the build must exclude the src/peers.d.ts shim (which would shadow the
        # genuine dsh-jobs module and break the JobKindMap augmentation). The
        # script probes for them instead of assuming.
        run: node scripts/build.mjs

      - name: Committed lib matches src
        # lib/ is committed so the suites exercise the artifact that ships. A
        # diff here means src changed without rebuilding — fail instead of
        # letting every later step "pass" against stale output.
        #
        # `lib/types/index.d.ts` is excluded, and only it. A local DSH install
        # ships no peer .d.ts files, so the build there goes through the
        # src/peers.d.ts shim and emits declarations with no peer type imports;
        # a clean clone (this runner) has the real declarations and emits them.
        # Both are correct for their environment, so those two files can never
        # be byte-identical. Every runtime artifact (.js and .js.map) is still
        # compared, which is what "src changed without rebuilding" actually
        # means; the declaration difference cannot affect behaviour.
        run: git diff --exit-code -- lib/ ':(exclude)lib/types/index.d.ts'

      - name: Offline suite
        run: node test/run.mjs

      - name: Panel suites
        run: npm run test:panel


